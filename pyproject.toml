[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-helper-bot"
version = "0.1"
description = "Calendar helper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aider-chat>=0.86.1",
    "aiogram>=3.22.0",
    "redis>=6.4.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["modules*"]

[project.scripts]
bot = "main:run_bot"

[tool.setuptools]
py-modules = ["main"]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.12.12",
]
